  - time: "14:30"
    title: "Panel: Navigating the wider infrastructural landscape in the Arts and Humanities: a UK and European perspective"
    note: "The research infrastructure landscape in the Arts and Humanities is increasingly complex. In addition to CLARIN and DARIAH, there are 10 European research infrastructures in the broader Social Science and Humanities Open Cluster (SSHOC). Alongside these, emerging initiatives include the European Open Science Cloud (EOSC), as well as cultural heritage data infrastructures, including the Collaborative Cloud for Cultural Heritage and the Data Space for Cultural Heritage. How can we ensure that researchers and practitioners in the Arts, Humanities and Heritage can i) navigate and access this increasingly complex infrastructural landscape; and ii) their needs are met in an inclusive way? <br>Speakers:Sally Chambers (The British Library, DARIAH), Simone Gigliotti (Royal Holloway, University of London, EHRI); Helen Clare (Jisc) - t.b.c.; Arran Rees (Museum Data Service | Collections Trust); Anna-Maria Sichani (Towards a National Collection);" 
