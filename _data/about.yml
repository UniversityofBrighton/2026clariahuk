# About-page content.
intro:
  heading: Why we're meeting
  text: >-
    This event brings the UK and European community 
    interested and involved in research infrastructures
    within the arts and humanities together for
    strengthening collaboration, sharing knowledge and
    exploring new opportunities. The event is organised
    by the CLARIN UK consortium, the DISKAH Network, and is colocated 
    with . It is open to all researchers, academics, GLAM practitioners and
    professionals as well as creative industries interested in shaping the infrastructures
    behind research. The event will take place on Friday 2 October 2026 at the University of Brighton, UK.

themes_heading: Themes
themes:
  - num: "01"
    title: Research Infrastructure
    text: Communities, tools, compute, data and services for research in the arts and humanities, and how they can be shared across disciplines and countries.
  - num: "02"
    title: Collections as Data
    text: Connecting data across libraries, museums, archives wtih infrastructures and services for research using FAIR and CARE principles.
  - num: "03"
    title: Policy & partnership
    text: Funding, sustainability and cross-sector collaboration on common challenges.
  - num: "04"
    title: Human Capital & Skils 
    text: Training, skills and career development for researchers, GLAM professionals and infrastructure developers.

audiences_heading: Who it's for
audiences:
  - Researchers & academics
  - GLAM researchers & professionals
  - UK policymakers
  - UKRI & research councils

